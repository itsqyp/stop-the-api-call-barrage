services:
  weather-proxy:
    build: .
    image: stop-the-api-call-barrages:0.1.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      CACHE_TTL_MS: "300000"
      CACHE_MAX_ENTRIES: "500"
      BATCH_WINDOW_MS: "10"
      RETRIES: "2"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
